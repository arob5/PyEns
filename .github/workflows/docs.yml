name: Build and deploy docs

# Builds Sphinx documentation and publishes it to GitHub Pages.
#
# One-time setup required in the repository settings:
#   Settings → Pages → Source → "GitHub Actions"
#
# After the first successful run, the docs will be live at:
#   https://arob5.github.io/PyEns/

on:
  push:
    branches: [main]
  # Allow triggering a manual build from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a new push cancels an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and doc dependencies
        run: |
          pip install -e .
          pip install \
            sphinx>=9.0 \
            pydata-sphinx-theme>=0.18 \
            myst-parser>=5.1 \
            sphinx-copybutton>=0.5

      - name: Build HTML docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
